name: Build RideLine Android app

on:
  push:
    paths:
      - 'ride/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Put the RideLine web app inside the APK
        run: |
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/ride
          cp -r ride android/app/src/main/assets/ride

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk RideLine.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RideLine-apk
          path: RideLine.apk

      - name: Publish download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rideline-v1.0.${{ github.run_number }}
          name: RideLine 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: RideLine.apk
          make_latest: true
          body: |
            RideLine bike navigation for Android.
            Download **RideLine.apk** below, open it on your phone and allow "Install unknown apps" for your browser.
