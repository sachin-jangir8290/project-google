# /etc/nginx/sites-available/pdfpup
# "tools.example.com" ki jagah apna subdomain likho
server {
    listen 80;
    server_name tools.example.com;

    root /var/www/pdfpup;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # static files cache
    location ~* \.(css|js|svg|png|jpg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;
}
