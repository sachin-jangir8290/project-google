plugins {
    id 'com.android.application'
}

android {
    namespace 'tech.openwise.rideline'
    compileSdk 34

    defaultConfig {
        applicationId "tech.openwise.rideline"
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName "1.0." + (System.getenv("VERSION_CODE") ?: "1")
    }

    signingConfigs {
        // Sideload key kept in the repo so every build installs over the previous one.
        // Replace with a private key stored in GitHub Secrets before publishing on Play Store.
        sideload {
            storeFile file("../rideline-sideload.keystore")
            storePassword "rideline"
            keyAlias "rideline"
            keyPassword "rideline"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
