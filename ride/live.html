<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b120c">
<title>Live Ride – RideLine</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<style>
:root{--lime:#d6f53f;--ink:#0b120c;--mu:#a6b3a2;--card:rgba(12,18,13,.88);--bd:rgba(255,255,255,.09)}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--ink);color:#f3f7ef;font-family:Urbanist,system-ui,sans-serif}
#map{position:fixed;inset:0}
.top{position:fixed;z-index:500;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:18px;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(12px)}
.top b{font-size:17px}.top b span{color:var(--lime)}.top small{color:var(--mu);margin-left:auto;font-size:13px;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:#ff4d4f}.dot.on{background:#6ee7b7;box-shadow:0 0 0 0 rgba(110,231,183,.6);animation:p 1.8s infinite}@keyframes p{70%{box-shadow:0 0 0 10px rgba(110,231,183,0)}}
.panel{position:fixed;z-index:500;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:14px;border-radius:22px;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(12px);max-width:520px;margin:0 auto}
.rider{display:flex;align-items:center;gap:12px;padding:8px 4px}.rider+.rider{border-top:1px solid var(--bd)}
.av{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--c);color:#0b120c;font-weight:800;border:2px solid #fff;flex:none}
.rider div{flex:1;min-width:0}.rider b{display:block;font-size:16px}.rider small{color:var(--mu);font-size:13px}
.rider em{font-style:normal;text-align:right}.rider em b{font-size:22px;color:var(--lime)}.rider em small{display:block}
.empty{color:var(--mu);text-align:center;padding:10px;font-size:14px}
.pin{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#0b120c;font:800 13px Urbanist,sans-serif;border:3px solid #fff;box-shadow:0 0 0 4px rgba(0,0,0,.3),0 6px 14px rgba(0,0,0,.5)}
.sos{background:#ff4d4f;color:#fff;border-radius:14px;padding:10px 12px;margin-bottom:10px;font-weight:700;display:none}
</style>
</head>
<body>
<div id="map"></div>
<div class="top"><b>Ride<span>Line</span> · Live</b><small><i class="dot" id="dot"></i><span id="st">Connecting…</span></small></div>
<div class="panel"><div class="sos" id="sos"></div><div id="list"><p class="empty">Waiting for the rider's location…</p></div></div>
<script>
const code=(location.hash.slice(1)||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const k=(window.RIDE_CONFIG&&RIDE_CONFIG.cartoKey)?'?key='+encodeURIComponent(RIDE_CONFIG.cartoKey):'';
const map=L.map('map',{zoomControl:false}).setView([22.5,79],5);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png'+k,{subdomains:'abcd',maxZoom:20,attribution:'© OpenStreetMap contributors © CARTO'}).addTo(map);
const M={},T={},trail={};let fitted=false,ws,retry=0;
const ini=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const ago=t=>{const s=Math.round((Date.now()-t)/1000);return s<60?'just now':s<3600?Math.round(s/60)+' min ago':Math.round(s/3600)+' h ago'};
function wsURL(){const s=(window.RIDE_CONFIG&&RIDE_CONFIG.groupServer)||'';if(s)return s;return (location.protocol==='https:'?'wss://':'ws://')+location.host+'/ride-ws'}
function connect(){if(!/^[A-Z0-9]{4,8}$/.test(code)){$('st').textContent='Invalid link';return}
 ws=new WebSocket(wsURL());ws.onopen=()=>{retry=0;ws.send(JSON.stringify({t:'watch',room:code}));$('dot').classList.add('on');$('st').textContent='Live'};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}
  if(m.t==='state'){(m.members||[]).forEach(x=>{M[x.id]=x;T[x.id]=x.at||Date.now()})}
  else if(m.t==='pos'||m.t==='join'){M[m.id]={...(M[m.id]||{}),...m};T[m.id]=Date.now()}
  else if(m.t==='leave'){delete M[m.id]}
  else if(m.t==='sos'){$('sos').style.display='block';$('sos').textContent=`SOS from ${m.name} — they need help. Their location is shown on the map.`;if(m.lat){map.flyTo([m.lat,m.lng],16)}}
  draw()};
 ws.onclose=()=>{$('dot').classList.remove('on');$('st').textContent='Reconnecting…';setTimeout(connect,Math.min(30000,2000*2**retry++))}}
function draw(){const list=Object.values(M).filter(x=>x.lat!=null);
 $('list').innerHTML=list.length?list.map(x=>`<div class="rider"><span class="av" style="--c:${esc(x.color||'#d6f53f')}">${esc(ini(x.name))}</span><div><b>${esc(x.name||'Rider')}</b><small>${x.riding?'Riding':'Stopped'}${x.dest?' · to '+esc(x.dest):''} · ${ago(T[x.id])}</small></div><em><b>${x.spd||0}</b><small>km/h</small></em></div>`).join(''):'<p class="empty">Waiting for the rider\'s location…</p>';
 const pts=[];for(const x of list){const ll=[x.lat,x.lng];pts.push(ll);(trail[x.id]=trail[x.id]||L.polyline([],{color:x.color||'#d6f53f',weight:5,opacity:.8}).addTo(map)).addLatLng(ll);
  const html=`<div class="pin" style="--c:${esc(x.color||'#d6f53f')}">${esc(ini(x.name))}</div>`;
  if(!M[x.id].mk)M[x.id].mk=L.marker(ll,{icon:L.divIcon({className:'',html,iconSize:[40,40],iconAnchor:[20,20]})}).addTo(map);else M[x.id].mk.setLatLng(ll)}
 if(pts.length&&!fitted){fitted=true;map.setView(pts[0],15)}}
setInterval(draw,15000);connect();
</script>
</body>
</html>
